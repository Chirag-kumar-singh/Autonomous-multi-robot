# Forces two robots to want the central junction at overlapping times:
# R1 goes P1 -> S1_DOCK (through JCT_CENTER via the vertical arm)
# R2 goes P3 -> S4_DOCK (through JCT_CENTER via the horizontal arm)
# both depart at t=0, so their JCT_CENTER windows should overlap unless
# the reservation table serializes them (expected: one WAITS).
speed_cm_s: 20
dt: 0.1
max_time_s: 120
robots:
  R1: {start: P1}
  R2: {start: P3}
tasks:
  R1:
    - {to: S1_DOCK, dwell_s: 4, purpose: pick, depart_after: 0}
  R2:
    - {to: S4_DOCK, dwell_s: 4, purpose: pick, depart_after: 0}
