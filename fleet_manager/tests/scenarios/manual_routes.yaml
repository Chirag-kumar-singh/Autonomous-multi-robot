# Simplest sanity scenario: 3 robots, each given a non-conflicting task
# (ring-only stations, different arms), no shared resources expected.
speed_cm_s: 20
dt: 0.1
max_time_s: 120
robots:
  R1: {start: P1}
  R2: {start: P2}
  R3: {start: P3}
tasks:
  R1:
    - {to: S6_DOCK, dwell_s: 8, purpose: pick, depart_after: 0}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop}
  R2:
    - {to: S5_DOCK, dwell_s: 8, purpose: pick, depart_after: 0}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop}
  R3:
    - {to: S4_DOCK, dwell_s: 8, purpose: pick, depart_after: 0}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop}
