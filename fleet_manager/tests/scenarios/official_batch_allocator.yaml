# Allocator-driven equivalent of official_batch_manual.yaml (Arena_Spec
# Section 7 official sample batch), using the SAME five orders and
# release times, but WITHOUT a pre-chosen robot per order. Robot
# selection is delegated to fleet_manager.allocation.allocator
# .FleetAllocator via the `orders:` scenario section (see
# fleet_manager/simulation/simulator.py's docstring).
#
# This file is a pure experiment artifact for the V1 allocator
# benchmark; it is NOT a replacement for official_batch_manual.yaml,
# which remains the canonical, human-assigned regression scenario and
# is left completely unchanged.
speed_cm_s: 20
dt: 0.1
max_time_s: 200
robots:
  R1: {start: P1}
  R2: {start: P2}
  R3: {start: P3}
orders:
  - {order_id: O1, station: S5, destination: DZ, released_at: 0, pick_dwell_s: 8, drop_dwell_s: 3}
  - {order_id: O2, station: S1, destination: DZ, released_at: 0, pick_dwell_s: 8, drop_dwell_s: 3}
  - {order_id: O3, station: S2, destination: DZ, released_at: 2, pick_dwell_s: 8, drop_dwell_s: 3}
  - {order_id: O4, station: S3, destination: DZ, released_at: 8, pick_dwell_s: 8, drop_dwell_s: 3}
  - {order_id: O5, station: S6, destination: DZ, released_at: 9, pick_dwell_s: 8, drop_dwell_s: 3}
