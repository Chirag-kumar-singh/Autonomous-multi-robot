# Official sample batch (Arena_Spec Section 7), translated into a manual
# robot/task assignment using the shortest-path-nearest-robot heuristic
# established in fleet_manager/tests/test_reservation.py:
#   O1 (S5) -> R2 (147cm, shortest)
#   O2 (S1) -> R1 (237cm, tied w/ R2 but R2 takes O1)
#   O3 (S2) -> R3 (145cm, shortest -- matches spec's "R3 much better placed")
#   O4 (S3) -> R1 (227cm, shortest; R1 does this after finishing O2)
#   O5 (S6) -> R1 (137cm, shortest; R1 does this after finishing O4)
# This is NOT an allocator -- it's a fixed, human-chosen assignment used to
# prove the simulator/reservation layer produces a safe run under a
# reasonable assignment. A future allocator module will make these
# decisions automatically and may choose differently (e.g. spread load).
speed_cm_s: 20
dt: 0.1
max_time_s: 200
robots:
  R1: {start: P1}
  R2: {start: P2}
  R3: {start: P3}
tasks:
  R1:
    - {to: S1_DOCK, dwell_s: 8, purpose: pick, depart_after: 0, label: O2}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop, label: O2}
    - {to: S3_DOCK, dwell_s: 8, purpose: pick, depart_after: 8, label: O4}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop, label: O4}
    - {to: S6_DOCK, dwell_s: 8, purpose: pick, depart_after: 9, label: O5}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop, label: O5}
  R2:
    - {to: S5_DOCK, dwell_s: 8, purpose: pick, depart_after: 0, label: O1}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop, label: O1}
  R3:
    - {to: S2_DOCK, dwell_s: 8, purpose: pick, depart_after: 2, label: O3}
    - {to: DZ_BAY, dwell_s: 3, purpose: drop, label: O3}
